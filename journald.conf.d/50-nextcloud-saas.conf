# /etc/systemd/journald.conf.d/50-nextcloud-saas.conf
# Retenção de logs NDJSON para Nextcloud SaaS Manager
# Instalado por: scripts/setup-ssh-gateway.sh
#
# Tags journald cobertas:
#   ncsaas-api-ssh          (SSH gateway audit — auth.notice/warning)
#   nextcloud-saas-worker   (worker daemon — daemon.notice/warning)
#   nextcloud-saas-occ-exec (OCC exec — daemon.notice/warning, Feature P)
#
# Retenção: 30 dias (conforme CONTRACTS §3.11)
# Máximo em disco: 2GB (evitar enchimento em servidor shared)

[Journal]
SystemMaxUse=2G
MaxRetentionSec=30day
MaxFileSec=1week
Compress=yes
