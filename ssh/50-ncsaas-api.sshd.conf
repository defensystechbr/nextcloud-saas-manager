# ssh/50-ncsaas-api.sshd.conf
# Materializado a partir de docs/ARCHITECTURE.md Apêndice A.4 (canônico).
# Drop-in para /etc/ssh/sshd_config.d/50-ncsaas-api.conf
# Aplicado por scripts/deploy-server.sh + recarregado com `systemctl reload ssh`.
#
# Restringe o usuário ncsaas-api (consumido pela API REST consumidora via SSH key).
# Defesa em profundidade: ForceCommand impede shell mesmo se a chave estiver "limpa";
# ainda assim, ~/.ssh/authorized_keys deve ter `command="/usr/local/bin/ncsaas-api-shim"`
# (Apêndice A.6) — duas camadas de validação de comando.

Match User ncsaas-api
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    AllowAgentForwarding no
    GatewayPorts no
    ForceCommand /usr/local/bin/ncsaas-api-shim
    MaxSessions 4
    MaxStartups 4:30:8
    LoginGraceTime 15s
    ClientAliveInterval 30
    ClientAliveCountMax 2
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    PermitRootLogin no
