# ssh/51-ncsaas-api-sftp.conf
# Drop-in para /etc/ssh/sshd_config.d/51-ncsaas-api-sftp.conf
# Materializado para Feature O.5 (SCP staging de anexos binários, CONTRACTS.md §3.9).
#
# Pré-requisito de instalação (scripts/deploy-server.sh):
#   install -d -m 0755 -o root -g root /opt/nextcloud-customers/inbox
#   chown root:root /opt/nextcloud-customers /opt/nextcloud-customers/inbox
#   # Subdir de cada staging-id é criado pelo shim com chown ncsaas-api: e 0700.
#
# IMPORTANTE: este drop-in tem prefixo 51 para ser carregado APÓS o 50, mas como
# os blocos `Match User` em sshd_config são aditivos por arquivo, os efeitos
# combinam-se. Aqui só adicionamos o subsystem internal-sftp + chroot.
#
# O SCP/SFTP do API consumidora deve usar:
#   scp <file> ncsaas-api@host:/<staging-uuid>/<file>
# (path relativo ao ChrootDirectory; o jail expõe /opt/nextcloud-customers/inbox como /).

Subsystem sftp internal-sftp -l INFO -f AUTH

Match User ncsaas-api
    # Nota: ForceCommand do drop-in 50 prevalece para sessões SSH normais.
    # Para SFTP, o cliente envia `subsystem sftp` no canal — o sshd substitui
    # ForceCommand pelo internal-sftp configurado abaixo.
    ChrootDirectory /opt/nextcloud-customers/inbox
    ForceCommand internal-sftp -d /%U -P "symlink,hardlink,fsetstat" -u 0027
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    AllowAgentForwarding no
